baseURL = "https://miqu.me/"
locale = "en-us"
title = "miqu.me"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[permalinks]
  [permalinks.page]
    blog = "/blog/:year/:month/:day/:slug/"
  [permalinks.taxonomy]
    categories = "/blog/categories/"
  [permalinks.term]
    categories = "/blog/categories/:slug/"

[taxonomies]
  category = "categories"

[markup.goldmark.renderer]
  unsafe = true

[pagination]
  pagerSize = 10

[params]
  author = "Miguel Angel Quiñones"
  description = "var blog = Human.write()"
  contentTypeName = "blog"
  showMenuItems = 6
  centerTheme = true
  subtitle = "var blog = Human.write()"
  readMore = "Read more"
  [params.logo]
    logoText = "miqu.me"
    logoHomeLink = "/"

[[menus.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 1
[[menus.main]]
  name = "Who?"
  pageRef = "/about"
  weight = 2
[[menus.main]]
  name = "Games"
  pageRef = "/games"
  weight = 3
[[menus.main]]
  name = "Speaking"
  pageRef = "/speaking"
  weight = 4
[[menus.main]]
  name = "Twitter"
  url = "https://twitter.com/miguelquinon"
  weight = 5
[[menus.main]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/miguelquinon"
  weight = 6

[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = false
  rel = "alternate"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputs]
  home = ["html", "rss", "atom"]
