name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.163.3
  HUGO_SHA256: 1234302ece1167cef2c252aaa69c89b4f0afc5851f1a30536d693e8e7fc4d1bf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          file=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "$base/$file"
          echo "${HUGO_SHA256}  $file" | sha256sum -c -
          sudo tar -xzf "$file" -C /usr/local/bin hugo
          hugo version
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        run: hugo --gc --minify
        env:
          HUGO_ENVIRONMENT: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
